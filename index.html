<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre vidéoclub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍿%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f3ead7;--card:#fffaf0;--tx:#2b2622;--mut:#7a6f63;--ac:#b8392b;--bd:#d9ccb3;--ln:#e8dcc3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Work Sans","Helvetica Neue",Arial,sans-serif;line-height:1.45}
header{padding:28px 18px 14px;max-width:1100px;margin:auto;border-bottom:3px double var(--bd)}
h1{margin:0;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(40px,8vw,64px);letter-spacing:2px;line-height:1}h1 span{color:var(--ac)}
.sub{color:var(--mut);margin:6px 0 0}
.bar{max-width:1100px;margin:auto;padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-weight:500;cursor:pointer;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px}
button.on{background:var(--tx);color:var(--card);border-color:var(--tx)}
input[type=checkbox]{accent-color:var(--ac)}
button.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{max-width:1100px;margin:auto;padding:6px 18px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 2px 10px #2b262214;overflow:hidden;display:flex;flex-direction:column}
.p{height:190px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;position:relative;overflow:hidden}
.p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#000a)}
.p *{position:relative;z-index:1}.p img{z-index:0}
.p b{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:28px;letter-spacing:1px;line-height:1;text-transform:uppercase;text-shadow:0 2px 8px #0008}
.p i{font-style:normal;font-size:12px;opacity:.9;margin-top:6px}
.tag{position:absolute!important;top:10px;left:10px;font-size:11px;background:#0008;padding:3px 8px;border-radius:999px}
.b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.syn{margin:0;font-size:14px;color:var(--mut)}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.t{font-size:13px;padding:7px 12px;text-decoration:none;color:#fff;font-weight:500;background:var(--ac);border-radius:999px}
.sm{font-size:12px;padding:5px 10px}
.box{border-top:1px solid var(--ln);padding-top:10px;font-size:14px}
.box h4{margin:0 0 6px;font-size:13px;color:var(--mut)}
.st span{cursor:pointer;font-size:22px;color:var(--ln)}.st span.f{color:#d9a02b}
.ro .st span{cursor:default;font-size:18px}
textarea,input[type=text],input[type=number],input[type=url]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--tx);font:inherit;font-size:14px}
textarea{min-height:54px;margin:6px 0;resize:vertical}
.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dim{color:var(--mut);font-style:italic}
.hl{outline:4px solid var(--ac);outline-offset:3px;animation:pulse .8s 2}
@keyframes pulse{50%{transform:scale(1.03)}}
#pk{max-width:1100px;margin:auto;padding:0 18px 6px;font-weight:700;font-size:18px}
#who,#msg,#form{max-width:1100px;margin:auto;padding:0 18px}
#msg{color:var(--ac)}
#form form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:grid;gap:10px;margin:10px 0;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
#form label{font-size:13px;color:var(--mut);display:grid;gap:4px}
#form .w{grid-column:1/-1}
#nav{max-width:1100px;margin:auto;padding:14px 18px 0;display:flex;gap:8px}
#quiz{max-width:760px;margin:auto;padding:6px 18px 40px}
.qz>*{margin-bottom:14px}
.qc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 2px 10px #2b262214;margin-bottom:14px}
.qc img{width:100%;max-height:340px;object-fit:cover;border-radius:8px;margin-bottom:12px;display:block}
.qt{font-style:italic;border-left:4px solid var(--ac);padding:4px 12px;margin:0 0 12px}
.qq{font-weight:700;margin:0 0 12px;font-size:18px}
.chs{display:grid;gap:8px;margin-bottom:12px}
.chs button{text-align:left;border-radius:10px;padding:12px 14px;font-size:15px}
.chs button.ok{background:#2e7d32;color:#fff;border-color:#2e7d32}
.chs button.no{background:var(--ac);color:#fff;border-color:var(--ac)}
.chs button.ok:disabled,.chs button.no:disabled{opacity:1}
button:disabled{opacity:.5;cursor:default}
.qrow{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--ln);padding:8px 0;font-size:14px}
.big{font-family:"Bebas Neue",Impact,sans-serif;font-size:56px;letter-spacing:1px;line-height:1;margin-bottom:8px}
.qf{display:grid;gap:10px;margin:12px 0}
.qf label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.cnt{position:absolute!important;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.cnt span{background:#0008;color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}
.omg{margin-top:10px;font-size:14px;font-weight:700}
.omgbar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin-top:4px}
.omgfill{height:100%;background:linear-gradient(90deg,#d9a02b,#b8392b)}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--card);padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
<h1>Notre <span>vidéoclub</span></h1>
<p class="sub">Notre bibliothèque, nos notes, nos critiques 🍿</p>
</header>
<div id="who"></div><div id="msg"></div>
<div id="nav"></div>
<div id="form"></div>
<div class="bar" id="bar"></div>
<div id="pk"></div>
<div class="grid" id="g"></div>
<div id="quiz" style="display:none"></div>
<div id="toast"></div>
<p class="dim" style="max-width:1100px;margin:0 auto;padding:0 18px 30px;font-size:12px">Données de films : TMDB. Ce site utilise l'API TMDB mais n'est ni endossé ni certifié par TMDB.</p>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {CFG} from "./config.js";


let me=null;try{me=localStorage.getItem("vc-me")}catch(e){}
const other=()=>me==="a"?"b":"a";
let films=[],data={},flt="Tous",db=null,editing=null,formOpen=false,qs=[],scores={},view="lib",Q={phase:"home"},drafts={},pickAll=false;try{pickAll=localStorage.getItem("vc-pick")==="all"}catch(e){}
const $=s=>document.querySelector(s);
const g=$("#g"),bar=$("#bar"),who=$("#who"),msg=$("#msg"),formEl=$("#form"),navEl=$("#nav"),quizEl=$("#quiz"),pkEl=$("#pk");
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};
const cats=()=>[...new Set(films.map(f=>f.cat).filter(Boolean))].sort();

function refresh(){
  if(view==="quiz"){if(Q.phase==="home"&&!quizEl.contains(document.activeElement))showQuiz();return}
  if(g.contains(document.activeElement)&&document.activeElement.tagName==="TEXTAREA")panels();else render();
}
try{
  db=getFirestore(initializeApp(CFG.firebase));
  onSnapshot(collection(db,"clubs",CFG.club,"films"),s=>{
    films=[];s.forEach(d=>films.push({...d.data(),id:d.id}));
    films.sort((a,b)=>(b.ts||0)-(a.ts||0));msg.textContent="";refresh();
  },e=>{msg.textContent="Connexion impossible : "+e.code});
  onSnapshot(collection(db,"clubs",CFG.club,"ratings"),s=>{
    data={};s.forEach(d=>{const v=d.data();(data[v.film]=data[v.film]||{})[v.who]=v});refresh();
  },e=>{msg.textContent="Connexion impossible : "+e.code});
  onSnapshot(collection(db,"clubs",CFG.club,"questions"),s=>{
    qs=[];s.forEach(d=>qs.push({...d.data(),id:d.id}));qs.sort((a,b)=>(a.ts||0)-(b.ts||0));refresh();
  },e=>{msg.textContent="Connexion impossible : "+e.code});
  onSnapshot(collection(db,"clubs",CFG.club,"scores"),s=>{
    scores={};s.forEach(d=>scores[d.id]=d.data());refresh();
  },e=>{msg.textContent="Connexion impossible : "+e.code});
}catch(e){msg.textContent="Firebase n'est pas configuré."}

function stars(n,onclick){
  const s=document.createElement("div");s.className="st";
  for(let i=1;i<=5;i++){const x=document.createElement("span");x.textContent="★";if(i<=n)x.className="f";if(onclick)x.onclick=()=>onclick(i);s.appendChild(x)}
  return s;
}
function chooseWho(){
  who.innerHTML="";
  const p=document.createElement("p");p.textContent="Tu es qui ? ";
  ["a","b"].forEach(k=>{const b=document.createElement("button");b.textContent=CFG.names[k];b.onclick=()=>{me=k;try{localStorage.setItem("vc-me",k)}catch(e){}render()};p.appendChild(b);p.append(" ")});
  who.appendChild(p);
}
const nerd=n=>n>=6?"loser":({2:"nerd",3:"jeez what a nerd",4:"GEEEEEKKK",5:"Jedi master nerd"})[n]||"";
let toastT;
function showToast(txt){const e=$("#toast");e.textContent=txt;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,3500)}
async function patchMine(fid,patch){
  if(!db)return;
  try{await setDoc(doc(db,"clubs",CFG.club,"ratings",fid+"_"+me),{film:fid,who:me,...patch},{merge:true})}catch(e){msg.textContent="Erreur : "+e.code}
}
function setCount(fid,n){const p={count:n};if(n>0){p.seen=true;if(drafts[fid])delete drafts[fid].seen}patchMine(fid,p)}
function otherBox(box,fid){
  const o=(data[fid]||{})[other()],mineSeen=((data[fid]||{})[me]||{}).seen;
  box.innerHTML="";
  box.appendChild(el("h4",null,CFG.names[other()]));
  if(o&&o.seen){
    box.appendChild(stars(o.rating||0));
    const t=el("div",o.review?null:"dim",o.review||"(pas de critique)");box.appendChild(t);
  }else box.appendChild(el("div","dim","Pas encore vu"));
  if(o&&o.count)box.appendChild(el("div",null,"👁 Vu "+o.count+" fois"+(nerd(o.count)?" · "+nerd(o.count):"")));
  if(o&&o.omg>0&&!mineSeen){
    const ob=el("div","omg");
    ob.appendChild(el("div",null,"🔥 OMG faut que tu le check · "+o.omg+"/10"));
    const tr=el("div","omgbar"),fl=el("div","omgfill");fl.style.width=(o.omg*10)+"%";tr.appendChild(fl);ob.appendChild(tr);box.appendChild(ob);
  }
}
function panels(){document.querySelectorAll("[data-o]").forEach(b=>otherBox(b,b.dataset.o))}
const seenBy=(f,k)=>((data[f.id]||{})[k]||{}).seen;
function matches(f){
  if(flt==="Pas vus par moi")return !seenBy(f,me);
  if(flt==="Vus par les deux")return seenBy(f,me)&&seenBy(f,other());
  if(flt==="Tous")return true;
  return f.cat===flt;
}
async function saveRating(fid,rating,review,seen,btn){
  if(!db)return;btn.textContent="…";
  try{await setDoc(doc(db,"clubs",CFG.club,"ratings",fid+"_"+me),{film:fid,who:me,rating,review,seen,ts:Date.now()},{merge:true});delete drafts[fid];btn.textContent="Enregistré ✓";setTimeout(()=>btn.textContent="Enregistrer",1500)}
  catch(e){btn.textContent="Erreur";msg.textContent="Erreur : "+e.code}
}

/* ---- formulaire d'ajout / modification ---- */
function renderForm(){
  formEl.innerHTML="";if(!formOpen)return;
  const f=editing||{};
  const form=document.createElement("form");
  form.innerHTML=`<label>Titre*<input type="text" name="title" required></label>
  <label>Année<input type="number" name="year" min="1888" max="2100"></label>
  <label>Catégorie (ex. Time capsule)<input type="text" name="cat" list="cl"></label><datalist id="cl"></datalist>
  <label class="w">Lien IMDb (optionnel, sinon le titre sert à chercher)<input type="url" name="imdb" placeholder="https://www.imdb.com/title/tt…"></label>
  <div class="w r"><button type="button" id="auto">🔍 Remplir automatiquement</button><span id="as" class="dim"></span></div>
  <input type="hidden" name="tmdb">
  <label class="w">Synopsis<textarea name="syn"></textarea></label>
  <label>Lien de l'affiche (URL d'image, optionnel)<input type="url" name="poster" placeholder="https://…"></label>
  <label>Lien de la bande-annonce (optionnel)<input type="url" name="trailer" placeholder="https://youtube.com/…"></label>
  <div class="w r"><button class="ac" type="submit">${editing?"Enregistrer les changements":"Ajouter à la bibliothèque"}</button><button type="button" id="cx">Annuler</button></div>`;
  cats().forEach(c=>{const o=document.createElement("option");o.value=c;form.querySelector("#cl").appendChild(o)});
  for(const k of ["title","year","cat","syn","poster","trailer","tmdb"])form.elements[k].value=f[k]||"";
  form.querySelector("#cx").onclick=()=>{formOpen=false;editing=null;renderForm()};
  form.querySelector("#auto").onclick=async()=>{
    const st=form.querySelector("#as"),key=CFG.tmdb;
    if(!key){st.textContent="Clé TMDB manquante dans la configuration.";return}
    const title=form.elements.title.value.trim(),year=form.elements.year.value,imdb=(form.elements.imdb.value.match(/tt\d+/)||[])[0];
    if(!imdb&&!title){st.textContent="Écris un titre ou colle un lien IMDb.";return}
    st.textContent="Recherche…";
    const api=async(path,q)=>{const r=await fetch("https://api.themoviedb.org/3"+path+"?api_key="+key+"&"+q);if(!r.ok)throw new Error(r.status);return r.json()};
    try{
      let m;
      if(imdb)m=((await api("/find/"+imdb,"external_source=imdb_id&language="+CFG.lang)).movie_results||[])[0];
      else m=((await api("/search/movie","query="+encodeURIComponent(title)+(year?"&year="+year:"")+"&language="+CFG.lang)).results||[])[0];
      if(!m){st.textContent="Aucun résultat.";return}
      let ov=m.overview;
      if(!ov){ov=(await api("/movie/"+m.id,"language=en-US")).overview||""}
      const trailer=async l=>((await api("/movie/"+m.id+"/videos","language="+l)).results||[]).find(v=>v.site==="YouTube"&&v.type==="Trailer");
      const tr=(await trailer(CFG.lang))||(await trailer("en-US"));
      const y=(m.release_date||"").slice(0,4);
      form.elements.title.value=m.title;form.elements.year.value=y;form.elements.syn.value=ov||"";form.elements.tmdb.value=m.id;
      if(m.poster_path)form.elements.poster.value="https://image.tmdb.org/t/p/w500"+m.poster_path;
      if(tr)form.elements.trailer.value="https://www.youtube.com/watch?v="+tr.key;
      st.textContent="Trouvé : "+m.title+" ("+y+"). Vérifie que c'est le bon film, puis ajoute.";
    }catch(e){st.textContent="Erreur de recherche ("+e.message+")."}
  };
  form.onsubmit=async e=>{
    e.preventDefault();const v=Object.fromEntries(new FormData(form));
    const ok=u=>/^https?:\/\//.test(u)?u:"";
    const ref=editing?doc(db,"clubs",CFG.club,"films",editing.id):doc(collection(db,"clubs",CFG.club,"films"));
    try{
      await setDoc(ref,{title:v.title.trim(),year:v.year?+v.year:null,cat:v.cat.trim(),syn:v.syn.trim(),poster:ok(v.poster.trim()),trailer:ok(v.trailer.trim()),tmdb:v.tmdb?+v.tmdb:null,ts:editing?(editing.ts||Date.now()):Date.now()});
      formOpen=false;editing=null;renderForm();
    }catch(err){msg.textContent="Erreur : "+err.code}
  };
  formEl.appendChild(form);form.elements.title.focus();
}

function render(){
  if(!me){chooseWho();bar.innerHTML="";g.innerHTML="";navEl.innerHTML="";quizEl.style.display="none";return}
  who.innerHTML="";const wp=document.createElement("p");wp.className="dim";wp.textContent="Connecté en tant que "+CFG.names[me]+" · ";
  const sw=document.createElement("button");sw.className="sm";sw.textContent="changer";sw.onclick=()=>{me=null;try{localStorage.removeItem("vc-me")}catch(e){}render()};wp.appendChild(sw);who.appendChild(wp);
  drawNav();pkEl.textContent="";
  if(view==="quiz"){bar.innerHTML="";g.innerHTML="";formEl.style.display="none";quizEl.style.display="";showQuiz();return}
  formEl.style.display="";quizEl.style.display="none";
  bar.innerHTML="";
  const add=document.createElement("button");add.className="ac";add.textContent="+ Ajouter un film";add.onclick=()=>{editing=null;formOpen=true;renderForm()};bar.appendChild(add);
  const r=document.createElement("button");r.textContent="🎲 Surprends-moi";r.onclick=pick;bar.appendChild(r);
  const pm=document.createElement("button");pm.className="sm";pm.textContent=pickAll?"Dans : toute la bibliothèque":"Dans : films pas vus";
  pm.onclick=()=>{pickAll=!pickAll;try{localStorage.setItem("vc-pick",pickAll?"all":"unseen")}catch(e){}render()};bar.appendChild(pm);
  if(flt!=="Tous"&&flt!=="Pas vus par moi"&&flt!=="Vus par les deux"&&!cats().includes(flt))flt="Tous";
  ["Tous",...cats(),"Pas vus par moi","Vus par les deux"].forEach(x=>{const b=document.createElement("button");b.textContent=x;if(x===flt)b.className="on";b.onclick=()=>{flt=x;render()};bar.appendChild(b)});
  g.innerHTML="";
  if(!films.length){const d=document.createElement("p");d.className="dim";d.style.gridColumn="1/-1";d.textContent="La bibliothèque est vide. Ajoute le premier film avec le bouton « + Ajouter un film ».";g.appendChild(d);return}
  films.forEach(f=>{
    if(!matches(f))return;
    const fid=f.id,mine=(data[fid]||{})[me]||{};
    const dr=drafts[fid]||(drafts[fid]={});let rating=dr.rating??(mine.rating||0),seen=dr.seen??!!mine.seen;
    const h=hue(f.title);
    const c=document.createElement("div");c.className="c";c.id="f-"+fid;
    c.innerHTML=`<div class="p" style="background:linear-gradient(160deg,hsl(${h},38%,38%),hsl(${(h+30)%360},35%,14%))"><span class="tag"></span><div class="cnt"></div><b></b><i></i></div><div class="b"><p class="syn"></p><div class="top"><a class="t" target="_blank" rel="noopener">▶ Bande-annonce</a><button class="sm" data-e>Modifier</button><button class="sm" data-d>Supprimer</button></div><div class="box" data-m></div><div class="box" data-o="${fid}"></div></div>`;
    const p=c.querySelector(".p");
    if(f.poster){const im=document.createElement("img");im.src=f.poster;im.alt="";im.referrerPolicy="no-referrer";im.onerror=()=>im.remove();p.prepend(im)}
    const cnt=c.querySelector(".cnt");
    ["a","b"].forEach(k=>{const n=((data[fid]||{})[k]||{}).count;if(n>0)cnt.appendChild(el("span",null,"👁 "+CFG.names[k]+" ×"+n))});
    const tag=c.querySelector(".tag");if(f.cat)tag.textContent=f.cat;else tag.remove();
    c.querySelector("b").textContent=f.title;c.querySelector("i").textContent=f.year||"";
    const syn=c.querySelector(".syn");if(f.syn)syn.textContent=f.syn;else syn.remove();
    c.querySelector("a").href=f.trailer||"https://www.youtube.com/results?search_query="+encodeURIComponent(f.title+" "+(f.year||"")+" bande-annonce");
    c.querySelector("[data-e]").onclick=()=>{editing=f;formOpen=true;renderForm();window.scrollTo({top:0,behavior:"smooth"})};
    c.querySelector("[data-d]").onclick=async()=>{if(confirm("Supprimer « "+f.title+" » de la bibliothèque ?"))try{await deleteDoc(doc(db,"clubs",CFG.club,"films",fid))}catch(e){msg.textContent="Erreur : "+e.code}};
    const m=c.querySelector("[data-m]");
    m.appendChild(el("h4",null,"Toi"));
    const cn=mine.count||0;
    const cr=el("div","r"),minus=el("button","sm","−"),plus=el("button","sm","+");
    cr.append(minus,plus,el("span",null,"Vu "+cn+" fois"+(nerd(cn)?" · "+nerd(cn):"")));
    minus.onclick=()=>{if(cn>0)setCount(fid,cn-1)};
    plus.onclick=()=>{if(cn<99){setCount(fid,cn+1);const w=nerd(cn+1);if(w)showToast((cn+1>=6?"💀 ":cn+1===5?"🧙 ":"🤓 ")+w)}};
    m.appendChild(cr);
    const sl=document.createElement("div");m.appendChild(sl);
    const paint=()=>{sl.innerHTML="";sl.appendChild(stars(rating,i=>{rating=i;seen=true;dr.rating=i;dr.seen=true;cb.checked=true;paint()}))};
    const ta=document.createElement("textarea");ta.placeholder="Ta critique…";ta.value=dr.review??(mine.review||"");ta.oninput=()=>{dr.review=ta.value};
    const row=document.createElement("div");row.className="r";
    const lb=document.createElement("label");const cb=document.createElement("input");cb.type="checkbox";cb.checked=seen;cb.onchange=()=>{seen=cb.checked;dr.seen=seen};lb.append(cb," Déjà vu");
    const sv=document.createElement("button");sv.textContent="Enregistrer";sv.onclick=()=>saveRating(fid,rating,ta.value.trim(),seen||rating>0,sv);
    row.append(lb,sv);m.append(ta,row);paint();
    if(!seenBy(f,other())){
      const ob=el("div","omg"),ol=el("div",null,"🔥 OMG faut que tu le check · "+(mine.omg||0)+"/10");
      const rg=document.createElement("input");rg.type="range";rg.min=0;rg.max=10;rg.value=mine.omg||0;
      rg.oninput=()=>{ol.textContent="🔥 OMG faut que tu le check · "+rg.value+"/10"};
      rg.onchange=()=>patchMine(fid,{omg:+rg.value});
      ob.append(ol,rg);m.appendChild(ob);
    }
    g.appendChild(c);
  });
  panels();
}
let lastPick=null;
function pick(){
  let pool=pickAll?films:films.filter(f=>!seenBy(f,me));
  if(pool.length>1)pool=pool.filter(f=>f.id!==lastPick);
  if(!pool.length){pkEl.textContent=pickAll?"La bibliothèque est vide.":"Rien à proposer : tu as vu tous les films (ou la bibliothèque est vide). Passe sur « toute la bibliothèque » pour en revoir un.";return}
  const f=pool[Math.floor(Math.random()*pool.length)];lastPick=f.id;
  let card=$("#f-"+f.id);
  if(!card){flt="Tous";render();card=$("#f-"+f.id)}
  pkEl.textContent="🎲 Ce soir : "+f.title+(f.year?" ("+f.year+")":"");
  document.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));
  if(card){card.classList.add("hl");card.scrollIntoView({behavior:"smooth",block:"center"})}
}

/* ================= QUIZ ================= */
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const tm=async(path,q)=>{const r=await fetch("https://api.themoviedb.org/3"+path+"?api_key="+CFG.tmdb+"&"+q);if(!r.ok)throw new Error(r.status);return r.json()};
const withSyn=()=>films.filter(f=>f.syn&&f.syn.length>30);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const unused=a=>{const u=a.filter(x=>!Q.used.has(x.id));return u.length?u:a};
const wrongTitles=f=>shuffle(films.filter(x=>x.id!==f.id)).slice(0,3).map(x=>x.title);

function drawNav(){
  navEl.innerHTML="";
  [["lib","📚 Bibliothèque"],["quiz","🎯 Quiz"]].forEach(([k,l])=>{
    const b=el("button",view===k?"on":null,l);
    b.onclick=()=>{view=k;Q={phase:"home"};render()};
    navEl.appendChild(b);
  });
}

async function genScene(){
  if(!CFG.tmdb||films.length<4)return null;
  const f=rnd(unused(films));
  let id=f.tmdb;
  if(!id){const r=await tm("/search/movie","query="+encodeURIComponent(f.title)+(f.year?"&year="+f.year:""));id=((r.results||[])[0]||{}).id}
  if(!id)return null;
  const im=await tm("/movie/"+id+"/images","include_image_language=null");
  const b=(im.backdrops||[]).filter(x=>!x.iso_639_1);
  if(!b.length)return null;
  Q.used.add(f.id);
  return {q:"Quel est ce film ?",img:"https://image.tmdb.org/t/p/w780"+rnd(b).file_path,ok:f.title,choices:shuffle([f.title,...wrongTitles(f)])};
}
function genSyn(){
  const pool=withSyn();if(!pool.length||films.length<4)return null;
  const f=rnd(unused(pool));Q.used.add(f.id);
  return {q:"Quel film correspond à ce synopsis ?",text:f.syn.split(f.title).join("…"),ok:f.title,choices:shuffle([f.title,...wrongTitles(f)])};
}
function genCustom(){
  const pool=qs.filter(c=>!Q.used.has(c.id));if(!pool.length)return null;
  const c=rnd(pool);Q.used.add(c.id);
  return {q:c.q,text:c.text,img:c.img,ok:c.ok,choices:shuffle([c.ok,...c.bad])};
}
async function nextQ(){
  const kinds=[];
  if(qs.length)kinds.push("custom","custom");
  if(CFG.tmdb&&films.length>=4)kinds.push("scene","scene");
  if(withSyn().length&&films.length>=4)kinds.push("syn");
  if(!kinds.length)return null;
  for(let t=0;t<8;t++){
    const k=rnd(kinds);let q=null;
    try{q=k==="custom"?genCustom():k==="scene"?await genScene():genSyn()}catch(e){}
    if(q)return q;
  }
  return null;
}
async function startQuiz(){
  Q={phase:"play",n:0,score:0,total:5,used:new Set(),cur:null,answered:null,loading:false};
  await advance();
}
async function advance(){
  if(Q.n>=Q.total)return finish();
  const run=Q;run.loading=true;showQuiz();
  const q=await nextQ();
  if(Q!==run)return;
  run.loading=false;
  if(!q)return finish();
  run.cur=q;run.answered=null;run.n++;showQuiz();
}
async function finish(){
  Q.phase="end";showQuiz();
  if(!Q.n||!db)return;
  const old=scores[me]||{};
  try{await setDoc(doc(db,"clubs",CFG.club,"scores",me),{who:me,best:Math.max(old.best||0,Q.score),last:Q.score,plays:(old.plays||0)+1,ts:Date.now()})}catch(e){msg.textContent="Erreur : "+e.code}
}

function qForm(){
  const f=document.createElement("form");f.className="qf";
  f.innerHTML=`<label>Question*<input type="text" name="q" required placeholder="Qui dit cette réplique ?"></label>
  <label>Réplique ou texte à deviner (optionnel)<textarea name="text"></textarea></label>
  <label>Lien d'une image (optionnel)<input type="url" name="img" placeholder="https://…"></label>
  <label>Bonne réponse*<input type="text" name="ok" required></label>
  <label>Mauvaises réponses* (une par ligne, au moins 2)<textarea name="bad" required></textarea></label>
  <div class="r"><button class="ac" type="submit">Ajouter la question</button></div>`;
  f.onsubmit=async e=>{
    e.preventDefault();const v=Object.fromEntries(new FormData(f));
    const bad=v.bad.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,5);
    if(bad.length<2){msg.textContent="Ajoute au moins 2 mauvaises réponses.";return}
    const img=/^https?:\/\//.test(v.img.trim())?v.img.trim():"";
    try{
      await setDoc(doc(collection(db,"clubs",CFG.club,"questions")),{q:v.q.trim(),text:v.text.trim(),img,ok:v.ok.trim(),bad,by:me,ts:Date.now()});
      msg.textContent="";Q.adding=false;if(document.activeElement)document.activeElement.blur();showQuiz();
    }catch(err){msg.textContent="Erreur : "+err.code}
  };
  return f;
}

function quizHome(w){
  const ready=qs.length>0||(films.length>=4&&(CFG.tmdb||withSyn().length>0));
  const c=el("div","qc");
  c.appendChild(el("p","qq","Quiz du vidéoclub"));
  c.appendChild(el("p","dim","5 questions : devine le film d'après une scène ou un synopsis, et réponds aux devinettes que vous avez écrites tous les deux."));
  if(!ready)c.appendChild(el("p","dim","Pour jouer, ajoute au moins 4 films à la bibliothèque ou écris quelques questions ci-dessous."));
  const play=el("button","ac","▶ Jouer");play.disabled=!ready;play.onclick=startQuiz;c.appendChild(play);
  w.appendChild(c);

  const s=el("div","qc");s.appendChild(el("p","qq","Meilleurs scores"));
  ["a","b"].forEach(k=>{const v=scores[k];s.appendChild(el("div","qrow",CFG.names[k]+" — "+(v?("meilleur score "+v.best+"/5 · "+v.plays+" partie"+(v.plays>1?"s":"")):"pas encore joué")))});
  w.appendChild(s);

  const qc=el("div","qc");qc.appendChild(el("p","qq","Nos questions ("+qs.length+")"));
  qc.appendChild(el("p","dim","Écris tes propres devinettes : une réplique, une scène en image, un souvenir de film…"));
  const add=el("button",null,Q.adding?"Fermer":"+ Ajouter une question");add.onclick=()=>{Q.adding=!Q.adding;showQuiz()};qc.appendChild(add);
  if(Q.adding)qc.appendChild(qForm());
  qs.forEach(c=>{
    const r=el("div","qrow");
    r.appendChild(el("span",null,c.q+(CFG.names[c.by]?" ("+CFG.names[c.by]+")":"")));
    const d=el("button","sm","🗑");
    d.onclick=async()=>{if(confirm("Supprimer cette question ?"))try{await deleteDoc(doc(db,"clubs",CFG.club,"questions",c.id))}catch(e){msg.textContent="Erreur : "+e.code}};
    r.appendChild(d);qc.appendChild(r);
  });
  w.appendChild(qc);
}

function showQuiz(){
  quizEl.innerHTML="";
  const w=el("div","qz");quizEl.appendChild(w);
  if(Q.phase==="home")return quizHome(w);
  if(Q.phase==="end"){
    const c=el("div","qc");
    if(!Q.n){
      c.appendChild(el("p","qq","Impossible de créer des questions pour l'instant."));
      c.appendChild(el("p","dim","Ajoute au moins 4 films à la bibliothèque ou écris des questions."));
    }else{
      const r=Q.score/Q.n;
      c.appendChild(el("div","big",Q.score+" / "+Q.n));
      c.appendChild(el("p","qq",r>=0.8?"Cinéphile accompli !":r>=0.5?"Pas mal du tout !":"Il va falloir revoir quelques classiques 🍿"));
    }
    const again=el("button","ac","Rejouer");again.onclick=startQuiz;
    const back=el("button",null,"Retour au quiz");back.onclick=()=>{Q={phase:"home"};showQuiz()};
    const row=el("div","r");row.append(again," ",back);c.appendChild(row);
    w.appendChild(c);return;
  }
  const q=Q.cur;
  const top=el("div","dim");
  if(Q.loading||!q){top.textContent="Question "+(Q.n+1)+"/"+Q.total+" · Score : "+Q.score;w.appendChild(top);w.appendChild(el("p","dim","Chargement…"));return}
  top.textContent="Question "+Q.n+"/"+Q.total+" · Score : "+Q.score;w.appendChild(top);
  const c=el("div","qc");
  if(q.img){const im=document.createElement("img");im.src=q.img;im.alt="";im.referrerPolicy="no-referrer";im.onerror=()=>im.remove();c.appendChild(im)}
  if(q.text)c.appendChild(el("p","qt",q.text));
  c.appendChild(el("p","qq",q.q));
  const chs=el("div","chs");
  const nxt=el("button","ac",Q.n>=Q.total?"Voir mon score":"Suivant →");nxt.style.display="none";nxt.onclick=advance;
  q.choices.forEach(ch=>{
    const b=el("button",null,ch);
    b.onclick=()=>{
      if(Q.answered)return;Q.answered=ch;
      if(ch===q.ok)Q.score++;else b.className="no";
      [...chs.children].forEach(x=>{if(x.textContent===q.ok)x.className="ok";x.disabled=true});
      top.textContent="Question "+Q.n+"/"+Q.total+" · Score : "+Q.score;
      nxt.style.display="";
    };
    chs.appendChild(b);
  });
  c.appendChild(chs);c.appendChild(nxt);w.appendChild(c);
}

render();
</script>
